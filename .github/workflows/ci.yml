name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  claims-check:
    name: claims match evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: { python-version: "3.12" }
      - name: install locked audit dependencies
        run: python -m pip install --require-hashes -r requirements-replay.lock
      - name: Scoped publication claims and generated documentation
        run: python3 scripts/check_publication.py
      - name: evidence manifest sha-pins
        run: python3 scripts/check_evidence.py --check

  replay:
    name: replay-mode demo (benchmark gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: { python-version: "3.12" }
      - name: install statistics layer
        run: python -m pip install --require-hashes -r requirements-replay.lock
      - name: re-validate cached benchmarks through pyhf
        run: python3 scripts/run.py ravel.validation.benchmark --fast

  tests:
    name: test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: { python-version: "3.12" }
      - name: install
        run: python -m pip install --require-hashes -r requirements-replay.lock
      - name: pytest
        run: python -m pytest tests -q

  spine:
    name: adversarial gate board (30 cases)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: { python-version: "3.12" }
      - name: install git hooks (G20 asserts the pre-commit gate is INSTALLED, not just present)
        run: bash scripts/maintenance/install-git-hooks.sh
      - name: spine_sim --require-all
        run: python3 tests/adversarial/run_suite.py --require-all

  package:
    name: isolated installed-wheel replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with: { python-version: "3.12" }
      - name: install locked replay runtime
        run: python -m pip install --require-hashes -r requirements-replay.lock
      - name: build wheel
        run: python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/ravel-dist"
      - name: install wheel and exercise console entry point outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps "$RUNNER_TEMP"/ravel-dist/ravel_hep-*.whl
          ravel validate --schema
          ravel replay --out "$RUNNER_TEMP/ravel-installed-replay"
      - name: verify packaged engines and replay away from source
        run: |
          export RAVEL_TEST_WHEEL="$(echo "$RUNNER_TEMP"/ravel-dist/ravel_hep-*.whl)"
          python -m pytest tests/unit/test_ravel_cli.py -q
