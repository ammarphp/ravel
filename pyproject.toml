[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ravel-hep"
version = "1.1.0"
description = "Source-bound collider studies, supervised tool workflows, and iterative research"
readme = "docs/cli.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "hatchling==1.27.0",
  "pyhf[minuit]==0.7.6",
  "numpy==1.26.4",
  "scipy==1.14.1",
  "matplotlib==3.9.4",
  "PyYAML>=6.0.2,<7",
  "mplhep==0.3.59",
  "uproot==5.3.12",
  "awkward==2.6.7",
  "hist==2.8.0",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
  "pypdfium2==5.14.0",
  "jsonschema>=4.23,<5",
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "certifi>=2024.8.30",
  "jsonpatch==1.33",
  "iminuit==2.32.0",
  "spey==0.2.6",
  "onnx==1.23.0",
  "onnxruntime==1.30.0",
  "jax[cpu]==0.4.35",
  "jaxlib==0.4.35",
  "hepdata-cli==0.3.1",
  "pytest>=8.3.5,<9",
  "packaging>=24.2,<27",
  "pandas==2.2.3",
  "emcee==3.1.6",
  "dynesty==2.1.5",
  "servicex==3.3.1",
  "func-adl-servicex-xaodr25==2.5.0.25.2.80",
  "wilson==2.5.2",
  "flavio==2.7.1",
  "particle==0.26.2",
  "smelli==2.4.3",
  "pySecDec==1.6.6",
  "camb==1.6.5",
  "classy==3.4.1.0",
  "cobaya==3.6.2",
  "pyslha==3.3.2",
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-checkpoint==4.2.0",
  "langchain-core==1.6.7",
  "pydantic==2.14.0",
]

[project.optional-dependencies]
source-tables = ["PyYAML>=6.0.2,<7"]
replay = [
  "pyhf[minuit]==0.7.6",
  "numpy>=1.26.4,<2",
  "scipy>=1.13.1,<1.15",
  "matplotlib>=3.9.4,<3.10",
  "PyYAML>=6.0.2,<7",
]
test = ["pytest>=8.3.5,<9"]
measurement = ["numpy>=1.26.4,<2", "scipy>=1.13.1,<1.15", "spey==0.2.6"]
classifier = ["numpy>=1.26.4,<2", "onnx==1.23.0", "onnxruntime==1.30.0"]
science = ["numpy>=1.26.4,<2", "scipy>=1.13.1,<1.15", "matplotlib>=3.9.4,<3.10", "mplhep>=0.3.59,<1", "uproot>=5.3,<6"]
figures = ["Pillow>=10,<13", "pypdf>=5,<7"]
source-validation = ["jsonschema>=4.23,<5"]
symbolic = ["sympy>=1.14.0,<2"]

[project.scripts]
ravel = "ravel.cli:main"
ravel-wms-condor-submit = "ravel.workflow.site_profiles.htcondor:submit_main"
ravel-wms-condor-status = "ravel.workflow.site_profiles.htcondor:status_main"

[project.urls]
Repository = "https://github.com/ammarphp/ravel"

[tool.hatch.build.targets.wheel]
packages = ["src/ravel"]
exclude = ["src/ravel/data/workflow"]

[tool.hatch.build.targets.sdist]
include = ["src/ravel", "pyproject.toml", "hatch_build.py", "scripts/run.py", "docs/cli.md", "LICENSE", "NOTICE", "requirements-replay.txt", "requirements-replay.lock", "requirements-full.txt", "requirements-site.txt", "requirements-site-wms.txt", "requirements-site-wms.in", "requirements-site-wms.lock",
  "environment", "native/scripts", "native/setup", "scripts/setup", "tests/unit/test_ravel_cli.py", "tests/unit/test_cli_initiate.py", "tests/unit/test_package_delivery.py", "tests/unit/test_python_installation.py", "tests/unit/workflow_instruction_inventory_fixture.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
